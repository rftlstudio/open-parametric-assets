name: Asset checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-chromium-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm test
      - run: npm run validate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: sim/requirements.txt
      - run: python -m pip install -r sim/requirements.txt
      - run: npm run dataset -- --samples 3 --renders --urdf
      - name: Simulate every exported URDF
        run: |
          for model in dist/dataset/urdf/*/model.urdf; do
            python sim/check_asset.py "$model" || exit 1
          done
      - uses: actions/upload-artifact@v4
        with:
          name: rendered-dataset
          path: dist/dataset/
          if-no-files-found: error
