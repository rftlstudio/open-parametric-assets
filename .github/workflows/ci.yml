name: Asset checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-chromium-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm test
      - run: npm run validate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: sim/requirements.txt
      - run: python -m pip install -r sim/requirements.txt
      - run: python -m unittest discover -s sim -p "test_*.py"
      - run: npm run dataset -- --samples 3 --corners --renders --urdf
      - name: Validate Croissant metadata
        run: |
          python -m pip install mlcroissant
          mlcroissant validate --jsonld dist/dataset/croissant.json
      - name: Run the two published samples in a fresh Python environment
        run: |
          python -m venv "$RUNNER_TEMP/opa-quickstart"
          "$RUNNER_TEMP/opa-quickstart/bin/pip" install mujoco==3.3.7
          "$RUNNER_TEMP/opa-quickstart/bin/python" examples/quickstart/quickstart.py
      - name: Simulate every exported URDF
        run: |
          status=0
          for model in dist/dataset/urdf/*/model.urdf; do
            python sim/check_asset.py "$model" || status=1
          done
          python sim/summarize_tasks.py dist/dataset/data.jsonl
          exit "$status"
      - uses: actions/upload-artifact@v4
        with:
          name: rendered-dataset
          path: dist/dataset/
          if-no-files-found: error
